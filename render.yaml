# Render blueprint — one-click deploy of EDGE LAB.
# In the Render dashboard: New → Blueprint → connect this repo. Render reads
# this file, builds the Dockerfile, and gives you a public https URL.
#
# PERSISTENCE: a Persistent Disk is mounted at /app/data (= EDGE_DB_PATH's dir),
# so the SQLite database SURVIVES deploys and restarts. Disks require a paid
# instance (Starter+); they also pin the service to a single instance and make
# deploys sequential (a few seconds of downtime on redeploy) — fine for this app.
# The DB is seeded only when the file is absent (scripts/start.sh), so it seeds
# once on the first deploy and persists thereafter — no more reseed-on-deploy.
services:
  - type: web
    name: edge-lab
    runtime: docker
    plan: starter        # disks need a paid plan (free has no persistent storage)
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: edge-data
      mountPath: /app/data   # matches EDGE_DB_PATH=/app/data/edge.db (Dockerfile)
      sizeGB: 1              # SQLite paper-trading DB — 1 GB is ample
    envVars:
      - key: POLYMARKET_ENABLED
        value: "true"    # pull matches + odds from Polymarket
      - key: SPORTS_ENABLED
        value: "true"    # pull ESPN live scores + real lineups/events (reassessment triggers)
      # Automated cron (in-process scheduler): parse + analyze + enter/exit on a loop.
      # NOTE: the scheduler runs INSIDE this web process, so it stops whenever the
      # process restarts (a redeploy, a crash, a burst of rapid pushes) or the instance
      # is briefly down. Safety nets, in order of importance:
      #   (1) LIVE-AWARE heartbeat: while a match is in play the fast loop stamps a
      #       DB-backed marker every tick; /api/health checks it and, if stale (the loop
      #       died), drives ONE live cycle right then — so exits/take-profits/reassessment
      #       resume within ~a minute of ANY health ping, not the 30-min tick.
      #   (2) an in-process catch-up watchdog, and (3) a full-cycle catch-up on /api/health
      #       when the pre-match tick is overdue.
      # Because (1) is driven by /api/health, an external monitor that pings it FREQUENTLY
      # is the strongest guarantee of unbroken live management. Point an uptime monitor
      # (cron-job.org / UptimeRobot) at GET /api/health every ~1 min — especially during
      # live windows — and avoid deploying while a match is live.
      - key: AUTO_TICK
        value: "true"
      - key: LIVE_TICK_SEC
        value: "20"      # fast real-time loop while a match is in play (goals → reassessment)
      - key: TICK_INTERVAL_MIN
        value: "30"      # odds/exits/analyze/enter cadence (pre-match)
      - key: DISCOVER_INTERVAL_HR
        value: "24"      # Polymarket parse cadence (matches surface ~7 days out)
      # LLM-cost + churn levers (live). The periodic reassessment HEARTBEAT is the slow,
      # cheap safety net — on-pitch events (goal/red/penalty) and price moves fire their
      # OWN reassessment immediately and DON'T wait for it. Data/stats stay dense
      # (STATS_INTERVAL_MIN) while the expensive LLM heartbeat runs slower. A repeat
      # partial take-profit on one position is throttled to PARTIAL_TP_THROTTLE_MIN (a
      # stop / thesis_stop / counter_scenario defensive exit is NEVER throttled).
      - key: REASSESS_INTERVAL_MIN
        value: "10"      # periodic LLM reassessment heartbeat (min); events fire immediately regardless
      - key: STATS_INTERVAL_MIN
        value: "5"       # match-stats snapshot cadence (data layer — kept dense)
      - key: PARTIAL_TP_THROTTLE_MIN
        value: "8"       # min minutes between partial TAKE-PROFIT fixations on one position (0 disables)
      # ANALYSIS DUEL (A/B): analyse each match with ONE of two models (≈50/50 by a
      # stable hash of the match id), so their logs + outcomes compare head-to-head.
      # "on" = default pair Opus 4.8 vs Fable 5; "Model A | Model B" to repoint; "off"
      # to stop. Bets are tagged by arm (code_version "…·opus48" / "…·fable5") so the
      # «Профили» tab segments them. NOTE: the ANTHROPIC_API_KEY must have access to
      # BOTH models, or analysis fails on that arm's half of the slate.
      - key: ANALYSIS_DUEL
        value: "on"
      # TENNIS scope: trade ATP + WTA SINGLES only (user). Drops ITF + doubles from both
      # import and the category prune (seriesAllowFor → pruneRemovedCategories). Slugs are
      # atp/wta (singles) vs atp-doubles/wta-doubles/itf. Unset = show every liquid series.
      - key: TENNIS_SERIES
        value: "atp,wta"
      # Live Claude analysis needs a key. sync:false means Render PROMPTS you for
      # the value in the dashboard on first deploy and KEEPS it across redeploys.
      # Recommended over entering the key in the UI: the env var is read before
      # the DB (llm.effectiveEnv), so it works from the first request and is never
      # lost. Never commit the key to the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Provider raw-snapshot logging (Анализ tab): capture what each data
      # provider returns per match — pre-match + live — for post-match comparison.
      # Each key is optional; a provider with no key is simply skipped. sync:false
      # → set the value in the Render dashboard (kept across redeploys).
      - key: SPORTMONKS_KEY      # Sportmonks v3 (World Cup All-in plan → live xG)
        sync: false
      - key: THESTATSAPI_KEY     # TheStatsAPI (Bearer; fapi_… key)
        sync: false
      # StatPal (paid, self-serve) — also powers the live StatPal+ESPN composite
      # provider for sports ESPN has no per-match feed for. sync:false → set in the
      # Render dashboard; the key activates both the composite provider and its snapshot.
      - key: STATPAL_KEY
        sync: false
