# Render blueprint — one-click deploy of EDGE LAB.
# In the Render dashboard: New → Blueprint → connect this repo. Render reads
# this file, builds the Dockerfile, and gives you a public https URL.
#
# PERSISTENCE: a Persistent Disk is mounted at /app/data (= EDGE_DB_PATH's dir),
# so the SQLite database SURVIVES deploys and restarts. Disks require a paid
# instance (Starter+); they also pin the service to a single instance and make
# deploys sequential (a few seconds of downtime on redeploy) — fine for this app.
# The DB is seeded only when the file is absent (scripts/start.sh), so it seeds
# once on the first deploy and persists thereafter — no more reseed-on-deploy.
services:
  - type: web
    name: edge-lab
    runtime: docker
    plan: starter        # disks need a paid plan (free has no persistent storage)
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: edge-data
      mountPath: /app/data   # matches EDGE_DB_PATH=/app/data/edge.db (Dockerfile)
      sizeGB: 1              # SQLite paper-trading DB — 1 GB is ample
    envVars:
      - key: POLYMARKET_ENABLED
        value: "true"    # pull matches + odds from Polymarket
      - key: SPORTS_ENABLED
        value: "true"    # pull ESPN live scores + real lineups/events (reassessment triggers)
      # Automated cron (in-process scheduler): parse + analyze + enter/exit on a loop.
      - key: AUTO_TICK
        value: "true"
      - key: LIVE_TICK_SEC
        value: "20"      # fast real-time loop while a match is in play (goals → reassessment)
      - key: TICK_INTERVAL_MIN
        value: "30"      # odds/exits/analyze/enter cadence (pre-match)
      - key: DISCOVER_INTERVAL_HR
        value: "24"      # Polymarket parse cadence (matches surface ~7 days out)
      # Live Claude analysis needs a key. sync:false means Render PROMPTS you for
      # the value in the dashboard on first deploy and KEEPS it across redeploys.
      # Recommended over entering the key in the UI: the env var is read before
      # the DB (llm.effectiveEnv), so it works from the first request and is never
      # lost. Never commit the key to the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Provider raw-snapshot logging (Анализ tab): capture what each data
      # provider returns per match — pre-match + live — for post-match comparison.
      # Each key is optional; a provider with no key is simply skipped. sync:false
      # → set the value in the Render dashboard (kept across redeploys).
      - key: SPORTMONKS_KEY      # Sportmonks v3 (World Cup All-in plan → live xG)
        sync: false
      - key: THESTATSAPI_KEY     # TheStatsAPI (Bearer; fapi_… key)
        sync: false
      # StatPal (paid, self-serve) — also powers the live StatPal+ESPN composite
      # provider for sports ESPN has no per-match feed for. sync:false → set in the
      # Render dashboard; the key activates both the composite provider and its snapshot.
      - key: STATPAL_KEY
        sync: false
